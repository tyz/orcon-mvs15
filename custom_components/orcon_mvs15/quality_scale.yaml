rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register any actions.
  appropriate-polling:
    status: done
    comment: |
      Updates are pushed over MQTT. The humidity sensor (12A0) is polled every
      5 minutes because that packet is not broadcast.
  brands:
    status: done
    comment: |
      The integration ships icon.png and logo.png in its brand directory, which
      Home Assistant serves for custom integrations.
  common-modules:
    status: done
    comment: |
      The coordinator lives in coordinator.py and the entities use Home
      Assistant's CoordinatorEntity instead of a custom base entity.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: |
      The user, discovery-info and reconfigure steps are covered, including
      the duplicate-topic abort.
  dependency-transparency:
    status: done
    comment: |
      There are no third-party runtime dependencies; MQTT is provided by Home
      Assistant.
  docs-actions:
    status: exempt
    comment: The integration does not register any actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Entities do not subscribe to events. The config entry listens once for
      Home Assistant's started event.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      The flow only stores the remote ID and MQTT topic. The gateway is
      discovered and verified during setup, which raises ConfigEntryNotReady
      when MQTT is unavailable.
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: |
      The user and reconfigure flows abort when another entry already uses the
      same MQTT topic.

  # Silver
  action-exceptions:
    status: exempt
    comment: |
      The integration does not register actions. Fan commands translate
      transport and validation failures into HomeAssistantError.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: |
      There is no options flow. The setup parameters are changed through the
      documented reconfigure flow.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Entities are unavailable until their first packet and while the MQTT
      connection is down.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      A lost and restored MQTT connection is logged once at info level, and
      the coordinators mark their entities unavailable in between.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The integration does not use authentication.
  test-coverage:
    status: done
    comment: |
      Pytest measures line coverage with pytest-cov, and CI fails when any
      module of the integration is at or below 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      The fan is an RF device; the only network-facing part is the Ramses ESP
      gateway, which is configured by MQTT topic and publishes no discovery
      payload. The fan and CO2 remote are discovered from Ramses packets after
      setup.
  discovery-update-info:
    status: exempt
    comment: |
      Devices are identified by stable Ramses IDs; there is no network address
      to update.
  docs-data-update: done
  docs-examples:
    status: done
    comment: |
      The README has a Lovelace card, an alert and a CO2-driven automation with
      hysteresis that shows how to set the fan preset.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: |
      The fan and CO2 devices are added when their first packet arrives,
      without reloading the entry.
  entity-category:
    status: done
    comment: |
      Signal strength sensors are diagnostic entities; the other entities are
      user-facing.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: |
      The signal strength sensors are diagnostic and disabled by default;
      users enable them when they need them.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      User-facing errors raise HomeAssistantError with a translation key, and
      the messages live in the exceptions section of strings.json.
  icon-translations:
    status: done
    comment: |
      icons.json defines the fan preset icons. No entity sets an icon in
      Python; the other icons come from the device class.
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: |
      No repair issues are raised yet, for example for a missing remote or a
      neighbour fan announcement.
  stale-devices:
    status: done
    comment: |
      The integration cannot enumerate the devices behind the RF gateway, so
      async_remove_config_entry_device lets the user remove a fan or CO2 device
      that is gone. The gateway stays while the entry exists.

  # Platinum
  async-dependency:
    status: exempt
    comment: |
      There is no third-party library; the integration uses Home Assistant's
      async MQTT client.
  inject-websession:
    status: exempt
    comment: The integration does not use a web session.
  strict-typing:
    status: todo
    comment: mypy passes the project settings, but strict mode is not enabled.
