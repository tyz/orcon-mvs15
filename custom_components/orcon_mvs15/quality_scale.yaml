rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register any actions.
  appropriate-polling:
    status: done
    comment: |
      Updates are pushed over MQTT or the USB serial port. The humidity sensor
      (12A0) is polled every 5 minutes because that packet is not broadcast.
  brands:
    status: done
    comment: |
      The integration ships icon.png and logo.png in its brand directory, which
      Home Assistant serves for custom integrations.
  common-modules:
    status: done
    comment: |
      The coordinator lives in coordinator.py and the entities use Home
      Assistant's CoordinatorEntity instead of a custom base entity.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: |
      The transport menu, MQTT and USB steps, discovery-info, reconfigure and
      options steps are covered, including the duplicate-topic and
      duplicate-port aborts.
  dependency-transparency:
    status: done
    comment: |
      There are no requirements of our own; MQTT and the USB serial support
      (serialx) are provided by Home Assistant components.
  docs-actions:
    status: exempt
    comment: The integration does not register any actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Entities do not subscribe to events. The config entry listens once for
      Home Assistant's started event.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      The USB step verifies the gateway by deriving its ID from the port's
      serial number. The MQTT step stores the topic; that gateway is discovered
      and verified during setup, which raises ConfigEntryNotReady when MQTT is
      unavailable.
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: |
      The user and reconfigure flows abort when another entry already uses the
      same MQTT topic or USB serial port.

  # Silver
  action-exceptions:
    status: exempt
    comment: |
      The integration does not register actions. Fan commands translate
      transport and validation failures into HomeAssistantError.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: |
      README.md documents the generated remote, MQTT topic, USB serial port and
      the packet-log option. The connection settings use the reconfigure flow;
      the packet log uses the options flow.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Entities are unavailable until their first packet and while the MQTT
      broker or gateway is down or the USB port is closed.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      A lost and restored broker, gateway or USB connection is logged once, and
      the coordinators mark their entities unavailable in between.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The integration does not use authentication.
  test-coverage:
    status: done
    comment: |
      Pytest measures line coverage with pytest-cov, and CI fails when any
      module of the integration is at or below 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      The fan is an RF device; the only network-facing part is the Ramses ESP
      gateway, which is configured by MQTT topic or USB serial port. Its USB
      descriptor is shared by every ESP32-S3, so a USB matcher would prompt
      unrelated boards. The fan and CO2 remote are discovered from Ramses
      packets after setup.
  discovery-update-info:
    status: exempt
    comment: |
      Devices are identified by stable Ramses IDs; there is no network address
      to update.
  docs-data-update: done
  docs-examples:
    status: done
    comment: |
      The README has a Lovelace card, an alert and a CO2-driven automation with
      hysteresis that shows how to set the fan preset.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: |
      The fan and CO2 devices are added when their first packet arrives,
      without reloading the entry.
  entity-category:
    status: done
    comment: |
      Signal strength sensors are diagnostic entities and the gateway reboot
      button is a configuration action; the other entities are user-facing.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: |
      The signal strength sensors are diagnostic and disabled by default;
      users enable them when they need them.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      User-facing errors raise HomeAssistantError with a translation key, and
      the messages live in the exceptions section of strings.json.
  icon-translations:
    status: done
    comment: |
      icons.json defines the fan preset icons and the gateway reboot button.
      No entity sets an icon in Python; the other icons come from the device
      class.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      A configured fan that sends no packet for 30 minutes raises a translated
      repair issue with the steps to check. A fan that reports a fault raises a
      translated repair issue with the LED patterns. Both issues are deleted
      when the entry unloads; the silence issue is also deleted when the fan is
      heard again, and its timer pauses while the gateway is unreachable.
  stale-devices:
    status: done
    comment: |
      The integration cannot enumerate the devices behind the RF gateway, so
      async_remove_config_entry_device lets the user remove a fan or CO2 device
      that is gone. The gateway stays while the entry exists.

  # Platinum
  async-dependency:
    status: exempt
    comment: |
      There is no third-party library of our own; the integration uses Home
      Assistant's async MQTT client and the serialx package that the usb
      component installs.
  inject-websession:
    status: exempt
    comment: The integration does not use a web session.
  strict-typing:
    status: done
    comment: |
      mypy.ini enables strict mode and mypy reports no issues. The remaining
      annotations were filled in for the packet envelope, the packet queue, the
      handler callbacks and the entity factories, and the platform constants
      are imported from their defining modules.
